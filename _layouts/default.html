<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9f6">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">Ayush</a>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="https://github.com/ayush52056">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="content">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>&copy; {{ 'now' | date: '%Y' }} Ayush</p>
        <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
      </div>
    </footer>
  </body>
</html>
